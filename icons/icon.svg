<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248a6f" />
      <stop offset="100%" stop-color="#145242" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer subtle border -->
  <rect x="6" y="6" width="500" height="500" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Main emblem container -->
  <g filter="url(#dropShadow)">
    <!-- Document background card -->
    <rect x="110" y="90" width="292" height="332" rx="28" fill="#ffffff" />
    
    <!-- Header band on card -->
    <path d="M 110 118 Q 110 90 138 90 L 374 90 Q 402 90 402 118 L 402 170 L 110 170 Z" fill="#e8f5f1" />
    
    <!-- Spreadsheet table grid representation -->
    <line x1="140" y1="215" x2="372" y2="215" stroke="#d5e2dc" stroke-width="8" stroke-linecap="round" />
    <line x1="140" y1="260" x2="372" y2="260" stroke="#d5e2dc" stroke-width="8" stroke-linecap="round" />
    <line x1="140" y1="305" x2="372" y2="305" stroke="#d5e2dc" stroke-width="8" stroke-linecap="round" />
    <line x1="140" y1="350" x2="372" y2="350" stroke="#d5e2dc" stroke-width="8" stroke-linecap="round" />

    <line x1="220" y1="185" x2="220" y2="380" stroke="#d5e2dc" stroke-width="6" stroke-linecap="round" />
    <line x1="300" y1="185" x2="300" y2="380" stroke="#d5e2dc" stroke-width="6" stroke-linecap="round" />

    <!-- KG Monogram in header -->
    <text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#1f7a62" text-anchor="middle" letter-spacing="2">KÊ GIỜ</text>

    <!-- Checkmark badge representing auto accuracy -->
    <circle cx="370" cy="380" r="48" fill="#10b981" />
    <path d="M 348 380 L 364 396 L 396 364" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>