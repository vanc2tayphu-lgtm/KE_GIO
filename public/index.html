<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kê giờ giáo viên THCS Tây Phú</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- Màn hình đăng nhập -->
      <div id="loginOverlay" class="login-overlay">
        <div class="login-panel">
          <div class="login-badge-app">
            <span class="brand-mark-login">KG</span>
            <span>THCS Tây Phú</span>
          </div>
          <div class="login-heading">
            <h2>Đăng nhập Kê Giờ</h2>
            <p>Vui lòng nhập mã giáo viên và mật khẩu 6 số được cấp.</p>
          </div>
          <div class="login-fields">
            <label>Mã giáo viên 
              <input id="loginEmail" type="text" autocomplete="username" placeholder="Ví dụ: TP105 hoặc mã được cấp" />
            </label>
            <label>Mật khẩu 
              <input id="loginCode" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="Nhập 6 số" />
            </label>
          </div>
          <button id="loginBtn" class="login-button" type="button">
            <span class="button-spinner" aria-hidden="true"></span>
            <span class="button-label">Đăng nhập</span>
          </button>
          <button id="forgotLoginCodeBtn" class="link-button" type="button">Quên mật khẩu?</button>
          <p id="syncStatus" class="sync-status">Chưa cấu hình đồng bộ.</p>
        </div>
      </div>

      <!-- Không gian làm việc 2 cột -->
      <section class="workspace">
        <aside class="sidebar" aria-label="Thiết lập bảng kê">
          <div class="brand">
            <div class="brand-top">
              <div class="brand-mark">KG</div>
              <div class="brand-main">
                <h1>Kê giờ</h1>
                <p>THCS Tây Phú</p>
              </div>
            </div>
            <div class="brand-actions">
              <button id="openChangePasswordBtn" class="secondary change-pass-btn" type="button" onclick="openChangePasswordModal()">🔒 Đổi mật khẩu</button>
              <button id="logoutBtn" class="logout-button" type="button">Đăng xuất</button>
            </div>
            <div class="brand-teacher-badge">
              <span class="teacher-badge-label">Giáo viên:</span>
              <strong id="brandTeacherName" class="brand-teacher-name"></strong>
            </div>
          </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
